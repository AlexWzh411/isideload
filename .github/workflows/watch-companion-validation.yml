name: Watch companion validation

on:
  push:
    branches:
      - work/watch-companion-xcode26-0.5.2
  pull_request:
    paths:
      - "isideload/**"
      - ".github/workflows/watch-companion-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Format and test isideload (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --manifest-path isideload/Cargo.toml --all -- --check
      - name: Run unit and integration tests
        run: cargo test --manifest-path isideload/Cargo.toml --all-targets
